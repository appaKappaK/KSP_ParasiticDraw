@DYNAMICBATTERYSTORAGE:NEEDS[DynamicBatteryStorage]
{
  HANDLERCATEGORY
  {
    name = ParasiticDraw
    title = Parasitic Draw
    module = ModuleParasiticDraw
  }

  PARTMODULEHANDLER
  {
    name = ModuleParasiticDraw
    type = Power
    handlerModuleName = GenericFieldDataHandler
    visible = true
    solarEfficiencyEffects = false
    producer = false
    consumer = true
    simulated = true
    continuous = true

    HANDLER_CONFIG
    {
      editorFieldName = ecRate
      flightFieldName = actualECRate
      editorValueScalar = -1.0
      flightValueScalar = -1.0
    }
  }
}

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleParasiticDraw]]:NEEDS[DynamicBatteryStorage]
{
  MODULE
  {
    name = ModuleParasiticDraw
  }
}
