PARASITIC_DRAW_SETTINGS
{
  enabled = true
  debugLogging = false

  passiveDrawEnabled = true
  passiveDrawPreset = Standard

  // Vessels below this part count are ignored. Set to 0 to affect every vessel.
  minimumPartCount = 0

  baseVesselDraw = 0.05
  perPartDraw = 0.01
  perMassTonDraw = 0.02

  // Standby habitation load from pressurized or crew-capable space.
  perCrewCapacityDraw = 0.15

  // Additional active load for crew currently aboard.
  perCrewPresentDraw = 0.05

  // Deliberately stacks with crew loads; avionics and control hardware draw power too.
  perCommandModuleDraw = 0.15

  globalDrawMultiplier = 1.0
}
